name: Build Android AAB for Play Store (V2 Fresh Start)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build --if-present

      - name: Add Android Platform
        run: npx cap add android --if-present

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Force Overwrite Min SDK Version to 24
        run: |
          if [ -f android/variables.gradle ]; then
            sed -i 's/minSdkVersion = 22/minSdkVersion = 24/g' android/variables.gradle
            echo "Successfully injected minSdkVersion = 24 flag."
          else
            echo "Error: android/variables.gradle not found!"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android App Bundle (AAB)
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: strait-escape-v2-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
