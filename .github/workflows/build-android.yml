name: Build Android AAB for Play Store (V2 Fresh Start)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Project Dependencies
        run: npm install --no-audit --no-fund

      - name: Build Web Frontend Assets
        run: npm run build --if-present

      - name: Initialize Android Native Target
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Inject Compiling Configurations
        run: |
          if [ -f android/variables.gradle ]; then
            sed -i 's/minSdkVersion = 22/minSdkVersion = 24/g' android/variables.gradle
            echo "Injected target minSdkVersion 24 successfully."
          else
            echo "Warning: Native build settings missing, setting manually."
            mkdir -p android
            echo "ext { minSdkVersion = 24; compileSdkVersion = 36; targetSdkVersion = 36 }" > android/variables.gradle
          fi

      - name: Compile and Bundle Android Binary
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Upload Finished Artifact Package
        uses: actions/upload-artifact@v4
        with:
          name: strait-escape-v2-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
