name: Build Android AAB for Play Store

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install project dependencies
        run: npm install

      - name: Add the Android platform
        run: npx cap add android || true

      - name: Sync web content into the Android project
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x ./android/gradlew

      - name: Generate Custom Keystore
        run: keytool -genkeypair -v -keystore android/app/release.keystore -alias strait-escape-key -keyalg RSA -keysize 2048 -validity 10000 -storepass straitpassword -keypass straitpassword -dname "CN=StraitEscape,O=Developer,C=US"

      - name: Build and Sign the Release AAB
        run: ./gradlew bundleRelease -Pandroid.injected.signing.store.file=$(pwd)/app/release.keystore -Pandroid.injected.signing.store.password=straitpassword -Pandroid.injected.signing.key.alias=strait-escape-key -Pandroid.injected.signing.key.password=straitpassword
        working-directory: android

      - name: Upload the Signed AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: strait-escape-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
