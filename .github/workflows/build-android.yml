name: Build Android AAB for Play Store (V2 Fresh Start)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Project Dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build Web Frontend Assets
        run: npm run build --if-present

      - name: Initialize Android Native Target
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Safely Update Min SDK Target
        run: |
          if [ -f "android/variables.gradle" ]; then
            sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 24/g' android/variables.gradle
            echo "Successfully updated minSdkVersion to 24."
          else
            echo "Error: android/variables.gradle not found!"
            exit 1
          fi

      - name: Link Repository Keystore to Deployment Directory
        run: |
          if [ -f "release.keystore" ]; then
            cp release.keystore android/release.keystore
            echo "Successfully mapped repository release certificate key."
          else
            echo "Error: release.keystore file missing from repository root! Please upload it first."
            exit 1
          fi

      - name: Inject Automated Signing Configurations Into Gradle
        run: |
          if [ -f "android/app/build.gradle" ]; then
            cat << 'EOF' >> android/app/build.gradle

          android {
              signingConfigs {
                  release {
                      storeFile file('../release.keystore')
                      storePassword 'capacitorpass123'
                      keyAlias 'releasekey'
                      keyPassword 'capacitorpass123'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF
            echo "Successfully injected uniform native certificate attributes."
          else
            echo "Error: build.gradle not found!"
            exit 1
          fi

      - name: Compile and Export Native Android Bundle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Upload Clean Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: strait-escape-v2-ready-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
