name: Build Android AAB for Play Store (V2 Fresh Start)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install project dependencies
        run: npm install

      - name: Add the Android platform
        run: npx cap add android || true

      - name: Sync web content into the Android project
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x ./android/gradlew

      - name: Generate Fresh V2 Keystore
        env:
          PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          keytool -genkeypair -v -keystore android/app/release.keystore \
            -alias strait-escape-v2-key -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASSWORD" -keypass "$PASSWORD" \
            -dname "CN=StraitEscapeV2,O=Developer,C=US"

      - name: Build and Sign the V2 Release AAB
        env:
          PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/release.keystore \
            -Pandroid.injected.signing.store.password="$PASSWORD" \
            -Pandroid.injected.signing.key.alias=strait-escape-v2-key \
            -Pandroid.injected.signing.key.password="$PASSWORD"
        working-directory: android

      - name: Upload the V2 Signed AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: strait-escape-v2-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
