name: Build Android AAB for Play Store

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install project dependencies
        run: npm install

      - name: Add the Android platform
        run: npx cap add android

      - name: Sync web content into the Android project
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x ./android/gradlew

      - name: Build the Release AAB
        run: ./gradlew bundleRelease
        working-directory: android

      # SIGNING STEP: Generates a temporary keystore and signs the AAB
      - name: Sign App Bundle
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias my-key-alias -keyalg RSA -keysize 2048 -validity 10000 -storepass testpassword -keypass testpassword -dname "CN=StraitEscape, OU=Gaming, O=Indie, L=City, S=State, C=US"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore release.keystore -storepass testpassword -keypass testpassword android/app/build/outputs/bundle/release/app-release-unsigned.aab my-key-alias
          mv android/app/build/outputs/bundle/release/app-release-unsigned.aab android/app/build/outputs/bundle/release/strait-escape-signed.aab

      # UPLOAD STEP: Uploads the freshly signed bundle file
      - name: Upload the AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: strait-escape-release-aab
          path: android/app/build/outputs/bundle/release/strait-escape-signed.aab
