name: Build Android AAB for Play Store (V2 Fresh Start)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Project Dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build Web Frontend Assets
        run: npm run build --if-present

      - name: Initialize Android Native Target
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Safely Update Min SDK Target
        run: |
          if [ -f "android/variables.gradle" ]; then
            sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 24/g' android/variables.gradle
            echo "Successfully updated minSdkVersion to 24 without touching other variables."
            cat android/variables.gradle
          else
            echo "Error: android/variables.gradle not found!"
            exit 1
          fi

      - name: Compile Unsigned Android App Bundle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Generate Custom Build Key
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias releasekey -keyalg RSA -keysize 2048 -validity 10000 -storepass mysecretpassword123 -keypass mysecretpassword123 -dname "CN=Android Build,O=Capacitor,C=US"

      - name: Sign Android App Bundle
        run: |
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore release.keystore -storepass mysecretpassword123 -keypass mysecretpassword123 android/app/build/outputs/bundle/release/app-release.aab releasekey

      - name: Upload Signed Artifact Package
        uses: actions/upload-artifact@v4
        with:
          name: strait-escape-v2-ready-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
