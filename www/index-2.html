<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a2e3d">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Strait Escape — Cargo Run</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    width: 100%; height: 100%;
    background: #0a2e3d;
    overflow: hidden;
    font-family: 'Comic Sans MS', 'Trebuchet MS', sans-serif;
    touch-action: none;
  }
  #wrap { position: relative; width: 100%; height: 100vh; display: flex; align-items: center; justify-content: center; }
  @supports (height: 100dvh) { #wrap { height: 100dvh; } }
  #rotateOverlay {
    position: fixed; inset: 0; z-index: 30;
    background: #04121c; color: #fff;
    display: none; align-items: center; justify-content: center;
    flex-direction: column; text-align: center; padding: 24px;
  }
  #rotateOverlay.show { display: flex; }
  #rotateOverlay .spin { font-size: 44px; margin-bottom: 12px; animation: spinIt 1.6s ease-in-out infinite; }
  @keyframes spinIt { 0%,100%{ transform: rotate(0deg);} 50%{ transform: rotate(90deg);} }
  #rotateOverlay p { font-size: 13px; color: #bfe9f7; max-width: 260px; }
  canvas {
    background: #1a5f7a;
    display: block;
    max-width: 100%;
    max-height: 100%;
  }
  #hud {
    position: absolute;
    top: calc(10px + env(safe-area-inset-top)); left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 0 14px;
    color: #fff;
    pointer-events: none;
    text-shadow: 0 2px 4px rgba(0,0,0,0.4);
  }
  #hud .label { font-size: 10px; opacity: 0.85; letter-spacing: 1px; }
  #hud .value { font-size: 17px; font-weight: bold; }
  #cargoTag { font-size: 11px; margin-top: 2px; opacity: 0.9; }
  #coinTag { font-size: 11px; margin-top: 1px; color: #ffe08a; }
  #healthBar { display: flex; gap: 3px; margin-top: 2px; }
  .heart { font-size: 17px; }
  .heart.lost { opacity: 0.25; filter: grayscale(1); }
  #progressWrap {
    position: absolute;
    top: calc(10px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    width: 42%; max-width: 200px;
    pointer-events: none;
  }
  #progressLabel {
    text-align: center; color: #fff; font-size: 9px; letter-spacing: 0.5px;
    margin-bottom: 3px; text-shadow: 0 2px 4px rgba(0,0,0,0.4);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #progressBar {
    width: 100%; height: 10px;
    background: rgba(255,255,255,0.25);
    border-radius: 6px;
    border: 2px solid rgba(255,255,255,0.5);
    overflow: hidden;
  }
  #progressFill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #ffd447, #ff9f43);
    border-radius: 4px;
    transition: width 0.15s linear;
  }
  #topControls {
    position: absolute;
    top: calc(8px + env(safe-area-inset-top)); right: calc(10px + env(safe-area-inset-right));
    display: flex; gap: 6px;
    z-index: 6;
  }
  .iconBtn {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: rgba(10,30,40,0.55);
    border: 2px solid rgba(255,212,71,0.8);
    color: #fff;
    font-size: 15px;
    display: flex; align-items: center; justify-content: center;
    padding: 0;
    box-shadow: none;
    cursor: pointer;
  }
  #pauseBtn { display: none; }
  #toastBox {
    position: absolute;
    top: 54px; left: 50%; transform: translateX(-50%);
    max-width: 84%;
    background: rgba(10,30,40,0.82);
    border: 2px solid #ffd447;
    border-radius: 10px;
    padding: 7px 14px;
    color: #fff8e0;
    font-size: 12px;
    text-align: center;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 3;
  }
  #toastBox.show { opacity: 1; }
  #overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 30%, #1a6f8a, #0a2e3d 75%);
    color: #fff; text-align: center; padding: 20px;
    z-index: 5;
    overflow-y: auto;
  }
  #overlay.overlay-pause { background: rgba(4,18,26,0.74); }
  #overlay h1 {
    font-size: 28px; color: #ffd447;
    text-shadow: 3px 3px 0 #b3580a, 0 0 20px rgba(255,212,71,0.4);
    margin-bottom: 4px;
    animation: bounceIn 0.5s ease;
  }
  @keyframes bounceIn {
    0% { transform: scale(0.7); opacity: 0; }
    60% { transform: scale(1.08); opacity: 1; }
    100% { transform: scale(1); }
  }
  #overlay .tagline { font-size: 12px; color: #bfe9f7; margin-bottom: 12px; font-style: italic; }
  #overlay p { font-size: 12px; color: #d7f0f9; margin: 4px 0; line-height: 1.4; max-width: 320px; }
  #overlay .big { font-size: 19px; color: #ffd447; margin: 8px 0; font-weight: bold; }
  button {
    padding: 11px 22px;
    background: #ff9f43;
    border: 3px solid #ffd447;
    color: #3a1e00;
    font-family: inherit;
    font-weight: bold;
    font-size: 14px;
    letter-spacing: 0.5px;
    border-radius: 26px;
    cursor: pointer;
    box-shadow: 0 4px 0 #b3580a;
    transition: transform 0.08s;
  }
  button:active { transform: translateY(2px) scale(0.98); box-shadow: 0 2px 0 #b3580a; }
  .startBtn { margin-top: 12px; display: block; max-width: 300px; }
  #shipPreview { font-size: 40px; margin-bottom: 4px; animation: floaty 2.4s ease-in-out infinite; }
  @keyframes floaty { 0%,100%{ transform: translateY(0) rotate(-2deg);} 50%{ transform: translateY(-6px) rotate(2deg);} }
  .coinPill {
    display: inline-block; background: rgba(255,212,71,0.15); border: 2px solid #ffd447;
    color: #ffd447; border-radius: 20px; padding: 4px 14px; font-size: 13px; font-weight: bold;
    margin-bottom: 8px;
  }
  .picker { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 7px 0; }
  .pickerArrow {
    background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.4); color: #fff;
    width: 28px; height: 28px; border-radius: 50%; font-size: 13px; box-shadow: none; padding: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .pickerArrow:active { transform: scale(0.9); }
  .pickerLabel { min-width: 155px; font-size: 12.5px; font-weight: bold; color: #ffd447; }
  .pickerLabel .lock { color: #cfd8dc; font-weight: normal; font-size: 11px; }
  .swatch { display: inline-block; width: 13px; height: 13px; border-radius: 3px; margin-right: 5px; vertical-align: middle; border: 1px solid rgba(255,255,255,0.5); }
  .diffRow { display: flex; gap: 8px; margin: 9px 0; }
  .diffBtn {
    padding: 7px 13px; font-size: 11.5px; border-radius: 18px;
    background: rgba(255,255,255,0.12); border: 2px solid rgba(255,255,255,0.35);
    color: #fff; box-shadow: none;
  }
  .diffBtn.active { background: #ff9f43; border-color: #ffd447; color: #3a1e00; }
  .smallLink {
    margin-top: 8px; background: none; border: none; box-shadow: none;
    color: #bfe9f7; text-decoration: underline; font-size: 11px; padding: 4px; display: block;
  }
  #achList, #levelList { text-align: left; max-width: 340px; margin: 10px 0; max-height: 380px; overflow-y: auto; width: 100%; }
  .achItem { display: flex; gap: 8px; padding: 7px 4px; border-bottom: 1px solid rgba(255,255,255,0.12); align-items: flex-start; }
  .achItem .ic { font-size: 20px; width: 26px; text-align: center; }
  .achItem.locked { opacity: 0.4; }
  .achItem .txt { font-size: 12px; }
  .achItem .txt b { display: block; font-size: 12.5px; color: #ffd447; }
  .achItem.locked .txt b { color: #cbd8de; }
  .levelRow {
    display: flex; align-items: center; gap: 10px; padding: 9px 8px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .levelRow.unlocked { cursor: pointer; }
  .levelRow.unlocked:active { background: rgba(255,212,71,0.12); }
  .levelRow.locked { opacity: 0.35; }
  .levelRow .num { font-size: 11px; color: #ffd447; width: 26px; text-align: right; font-weight: bold; }
  .levelRow .lname { font-size: 12.5px; flex: 1; }
  .levelRow .stat { font-size: 15px; width: 22px; text-align: center; }
  #touchHint {
    position: absolute;
    bottom: calc(20px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.55); font-size: 11px; text-align: center;
    pointer-events: none; z-index: 2;
    text-shadow: 0 2px 4px rgba(0,0,0,0.6);
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="420" height="720"></canvas>
  <div id="hud">
    <div>
      <div class="label">SCORE</div>
      <div class="value" id="scoreLabel">0</div>
      <div id="cargoTag"></div>
      <div id="coinTag">🪙 0</div>
    </div>
    <div>
      <div class="label" style="text-align:right">HULL</div>
      <div id="healthBar"></div>
    </div>
  </div>
  <div id="progressWrap">
    <div id="progressLabel">LEVEL</div>
    <div id="progressBar"><div id="progressFill"></div></div>
  </div>
  <div id="topControls">
    <button class="iconBtn" id="soundBtn">🔊</button>
    <button class="iconBtn" id="pauseBtn">⏸</button>
  </div>
  <div id="toastBox"></div>
  <div id="touchHint">drag anywhere on the water to steer</div>
  <div id="overlay"></div>
  <div id="rotateOverlay"><div class="spin">🔄</div><h1 style="font-size:20px;color:#ffd447;margin-bottom:8px;">ROTATE YOUR DEVICE</h1><p>Strait Escape is a portrait-mode voyage — turn your phone upright to keep sailing.</p></div>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const overlay = document.getElementById('overlay');
  const progressFill = document.getElementById('progressFill');
  const progressLabel = document.getElementById('progressLabel');
  const scoreLabel = document.getElementById('scoreLabel');
  const cargoTag = document.getElementById('cargoTag');
  const coinTag = document.getElementById('coinTag');
  const healthBar = document.getElementById('healthBar');
  const toastBox = document.getElementById('toastBox');
  const soundBtn = document.getElementById('soundBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const touchHint = document.getElementById('touchHint');

  const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

  // ================= persistent storage (local to this device/install) =================
  function lsGet(key, fallback) {
    try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); }
    catch(e) { return fallback; }
  }
  function lsSet(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }

  let coins = lsGet('se_coins', 0);
  let unlockedSkinIdxs = new Set(lsGet('se_unlocked_skins', [0]));
  let highestUnlockedLevel = lsGet('se_unlocked_level', 1);
  let completedLevelIds = new Set(lsGet('se_completed_levels', []));
  function persistAll() {
    lsSet('se_coins', coins);
    lsSet('se_unlocked_skins', [...unlockedSkinIdxs]);
    lsSet('se_unlocked_level', highestUnlockedLevel);
    lsSet('se_completed_levels', [...completedLevelIds]);
  }
  function updateCoinUI() { coinTag.textContent = '🪙 ' + coins; }

  // ================= AUDIO (synthesized, no external files) =================
  let audioCtx = null, masterGain = null;
  let soundOn = true;
  let musicTimer = null, musicStep = 0;
  const MUSIC_NOTES = [392, 440, 494, 587, 659, 587, 494, 440];

  function initAudio() {
    if (audioCtx) return;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = soundOn ? 0.5 : 0;
      masterGain.connect(audioCtx.destination);
    } catch(e) {}
  }
  function playTone(freq, dur, type, vol, when) {
    if (!audioCtx) return;
    when = when || 0;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    const t0 = audioCtx.currentTime + when;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    osc.connect(g); g.connect(masterGain);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  }
  function playSweep(freqStart, freqEnd, dur, type, vol) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type || 'sawtooth';
    const t0 = audioCtx.currentTime;
    osc.frequency.setValueAtTime(freqStart, t0);
    osc.frequency.exponentialRampToValueAtTime(Math.max(freqEnd,1), t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    osc.connect(g); g.connect(masterGain);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  }
  function playClickSfx() { playTone(650, 0.06, 'square', 0.15); }
  function playHitSfx() { playSweep(320, 90, 0.22, 'square', 0.3); }
  function playCollectSfx() { playTone(1046, 0.08, 'sine', 0.18); playTone(1568, 0.1, 'sine', 0.16, 0.06); }
  function playAchievementSfx() { [660,880,1100].forEach((f,i)=>playTone(f,0.18,'triangle',0.22,i*0.12)); }
  function playWinSfx() { [523,659,784,1046].forEach((f,i)=>playTone(f,0.3,'triangle',0.26,i*0.15)); }
  function playGameOverSfx() { playSweep(420, 60, 0.7, 'sawtooth', 0.28); }

  function scheduleMusicStep() {
    if (soundOn && audioCtx) {
      const freq = MUSIC_NOTES[musicStep % MUSIC_NOTES.length];
      playTone(freq, 0.28, 'triangle', 0.10);
      if (musicStep % 2 === 0) playTone(freq/2, 0.3, 'sine', 0.06);
    }
    musicStep++;
    musicTimer = setTimeout(scheduleMusicStep, 300);
  }
  function startMusic() { if (musicTimer) return; scheduleMusicStep(); }

  function toggleSound() {
    soundOn = !soundOn;
    if (masterGain) masterGain.gain.value = soundOn ? 0.5 : 0;
    soundBtn.textContent = soundOn ? '🔊' : '🔇';
    playClickSfx();
  }
  soundBtn.addEventListener('click', toggleSound);
  ['pointerdown','keydown'].forEach(evt => window.addEventListener(evt, function unlock(){ initAudio(); startMusic(); }, { once: true }));

  // ================= content data =================
  const SKINS = [
    { name: 'MV Wobbleton', hull: '#e6533c', hullDark: '#b3392a', trim: '#8a2f1f', price: 0 },
    { name: 'SS Duckwaddle', hull: '#ffd447', hullDark: '#d9ac1f', trim: '#b3860a', price: 150 },
    { name: 'The Salty Biscuit', hull: '#4fb3d9', hullDark: '#2f88ab', trim: '#1d6f8a', price: 300 },
    { name: 'Old Rustbucket', hull: '#8a6d4a', hullDark: '#654e33', trim: '#4a3a24', price: 500 }
  ];
  const CARGO = [
    { name: 'Rubber Ducks', icon: '🦆', colors: ['#ffd447','#4fb3d9','#7bd47b'] },
    { name: 'Pineapples', icon: '🍍', colors: ['#f4c542','#8bc34a','#f4a442'] },
    { name: 'Garden Gnomes', icon: '🧙', colors: ['#d9534f','#5bc0de','#5cb85c'] },
    { name: 'Confetti', icon: '🎉', colors: ['#ff6ec7','#7fdbff','#ffd447'] }
  ];
  const DIFFICULTIES = [
    { name: 'Easy', spawnMult: 0.7, speedMult: 0.8, health: 4 },
    { name: 'Normal', spawnMult: 1, speedMult: 1, health: 3 },
    { name: 'Hard', spawnMult: 1.4, speedMult: 1.3, health: 2 }
  ];
  const RADIO_LINES = [
    "Port Control: \"Do NOT feed the pufferfish. We mean it this time.\"",
    "Captain Grubb: \"Nice hat.\" (You are not wearing a hat.)",
    "Port Control: \"Cargo insurance does not cover coconuts. Please advise.\"",
    "Unknown Chatter: \"Has anyone seen my dinghy? Had cannonballs in it.\"",
    "Port Control: \"Kindly stop honking at the seagulls.\"",
    "Captain Grubb: \"Yo ho ho and a... wait, wrong strait.\"",
    "Port Control: \"ETA requested. Also, nice ducks.\"",
    "Harbor Master: \"We do not do refunds on damaged confetti.\"",
    "Captain Grubb: \"Is it just me or does that pufferfish look judgmental?\""
  ];

  // ---- 50 levels, themed after real waterways (comedic hazards remain entirely fictional) ----
  const WATERWAYS = [
    ['Gibraltar','Strait of Gibraltar','Temperate'], ['Dover','Strait of Dover','Temperate'], ['Bosphorus','The Bosphorus','Temperate'],
    ['Dardanelles','The Dardanelles','Temperate'], ['Messina','Strait of Messina','Volcanic'], ['Otranto','Strait of Otranto','Temperate'],
    ['Sicily','Strait of Sicily','Temperate'], ['Bonifacio','Strait of Bonifacio','Temperate'], ['Öresund','Öresund Strait','Temperate'],
    ['Kattegat','The Kattegat','Temperate'], ['Skagerrak','The Skagerrak','Temperate'], ['Malacca','Strait of Malacca','Tropical'],
    ['Sunda','Sunda Strait','Volcanic'], ['Lombok','Lombok Strait','Volcanic'], ['Makassar','Makassar Strait','Tropical'],
    ['Taiwan','Taiwan Strait','Tropical'], ['Korea','Korea Strait','Temperate'], ['Tsugaru','Tsugaru Strait','Temperate'],
    ['La Pérouse','La Pérouse Strait','Arctic'], ['Bering','Bering Strait','Arctic'], ['Cook','Cook Strait','Temperate'],
    ['Torres','Torres Strait','Tropical'], ['Bass','Bass Strait','Temperate'], ['Palk','Palk Strait','Tropical'],
    ['Mozambique','Mozambique Channel','Tropical'], ['Davis','Davis Strait','Arctic'], ['Denmark','Denmark Strait','Arctic'],
    ['Drake','Drake Passage','Arctic'], ['Magellan','Strait of Magellan','Arctic'], ['Beagle','Beagle Channel','Arctic'],
    ['Juan de Fuca','Strait of Juan de Fuca','Temperate'], ['Georgia','Strait of Georgia','Temperate'], ['Suez','Suez Canal','Desert'],
    ['Panama','Panama Canal','Tropical'], ['Kiel','Kiel Canal','Temperate'], ['Corinth','Corinth Canal','Temperate'],
    ['Erie','Erie Canal','Temperate'], ['Welland','Welland Canal','Temperate'], ['Manchester','Manchester Ship Canal','Temperate'],
    ['Houston','Houston Ship Channel','Desert'], ['Singapore','Singapore Strait','Tropical'], ['Yucatán','Yucatán Channel','Tropical'],
    ['Windward','Windward Passage','Tropical'], ['Mona','Mona Passage','Tropical'], ['Belle Isle','Strait of Belle Isle','Arctic'],
    ['Hudson','Hudson Strait','Arctic'], ['Formosa','Formosa Channel','Tropical'], ['Nantucket','Nantucket Sound','Temperate'],
    ['Long Island','Long Island Sound','Temperate'], ['Solent','The Solent','Temperate']
  ];
  const SUFFIXES = ['Gauntlet','Shuffle','Squeeze','Splash','Twist','Dash','Bend','Loop','Swirl','Zigzag','Wiggle','Current','Crossing','Scramble'];
  const LEVELS = WATERWAYS.map((w,i) => ({
    id: i+1,
    place: w[0],
    full: w[1],
    name: `${w[0]} ${SUFFIXES[i % SUFFIXES.length]}`,
    targetDistance: 3200 + i*85,
    hazardMult: 1 + i*0.045,
    coinReward: 40 + i*3
  }));

  // ---- regional palettes: each real waterway's climate picks its own look ----
  const BIOMES = {
    Temperate: { water: '#2a6b85', coast: '#4f8f5a', coastDark: '#356b3d', decor: '🌳' },
    Tropical:  { water: '#1a5f7a', coast: '#3d9e5c', coastDark: '#2a7a42', decor: '🌴' },
    Arctic:    { water: '#4a7a94', coast: '#c9d6da', coastDark: '#9fb3b8', decor: '🌲' },
    Desert:    { water: '#2f7a8a', coast: '#c9a86a', coastDark: '#a3813f', decor: '🌵' },
    Volcanic:  { water: '#1f4f66', coast: '#5a5460', coastDark: '#3a3540', decor: '🌋' }
  };
  function biomeForLevel(idx) { return BIOMES[WATERWAYS[idx][2]]; }
  let biome = BIOMES.Temperate;

  const ACHIEVEMENTS = [
    { id:'first', name:'First Voyage', desc:'Complete Level 1.', check: r => r.won },
    { id:'flawless', name:'Smooth Sailing', desc:'Clear a level without taking a single hit.', check: r => r.won && r.hitsTaken===0 },
    { id:'clutch', name:'Barely Made It', desc:'Clear a level with only one heart left.', check: r => r.won && r.finalHealth===1 },
    { id:'speedy', name:'Express Delivery', desc:'Clear a level in under 45 seconds.', check: r => r.won && r.timeSeconds<45 },
    { id:'hardmode', name:'Storm Survivor', desc:'Clear a level on Hard difficulty.', check: r => r.won && r.difficultyName==='Hard' },
    { id:'five_levels', name:'Getting Somewhere', desc:'Clear 5 levels.', check: r => r.completedCount>=5 },
    { id:'ten_levels', name:'Seasoned Sailor', desc:'Clear 10 levels.', check: r => r.completedCount>=10 },
    { id:'all_ships', name:'Fleet Owner', desc:'Unlock every ship skin.', check: r => r.allShipsOwned },
    { id:'circumnavigator', name:'Circumnavigator', desc:'Clear all 50 levels.', check: r => r.completedCount>=50 }
  ];
  const unlockedAchievements = new Set();

  // ================= selection & game state =================
  let selSkin = 0, selCargo = 0, selDiff = 1;
  let currentLevelIdx = 0;
  let state = 'menu'; // menu | playing | paused | win | over
  let frame = 0;
  let TOTAL_DISTANCE = 3200;
  let distance = 0;
  let score = 0;
  let health = 3, maxHealth = 3;
  let invuln = 0;
  let hitsTaken = 0;
  let speedBoostEndFrame = 0;
  let shieldEndFrame = 0;
  let fogEndFrame = 0;
  let nextEventAtDistance = 900;
  let nextRadioAtFrame = 240;
  let shakeMag = 0, shakeFrames = 0;

  function nextIncompleteLevelIdx() { return Math.min(Math.max(highestUnlockedLevel,1), LEVELS.length) - 1; }

  const ship = { x: W/2, y: H - 100, w: 34, h: 52, speed: 3.6, wobble: 0 };

  const keys = {};
  window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    keys[k] = true;
    if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
    if (k === 'p' || k === 'escape') { if (state==='playing' || state==='paused') togglePause(); }
  });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
  pauseBtn.addEventListener('click', togglePause);

  // ---- analog drag-anywhere steering (no on-screen pad) ----
  const wrapEl = document.getElementById('wrap');
  let dragActive = false;
  let dragOriginX = 0, dragOriginY = 0, dragCurX = 0, dragCurY = 0;
  let touchAxisX = 0, touchAxisY = 0;
  const DRAG_MAX = 70;
  function clientToCanvas(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return { x: (clientX-rect.left) * (canvas.width/rect.width), y: (clientY-rect.top) * (canvas.height/rect.height) };
  }
  function isControlTarget(t) { return t.closest && t.closest('#topControls'); }
  wrapEl.addEventListener('touchstart', e => {
    if (state !== 'playing' || isControlTarget(e.target)) return;
    const t = e.touches[0]; const p = clientToCanvas(t.clientX, t.clientY);
    dragActive = true; dragOriginX = p.x; dragOriginY = p.y; dragCurX = p.x; dragCurY = p.y;
    touchAxisX = 0; touchAxisY = 0;
  }, { passive: true });
  wrapEl.addEventListener('touchmove', e => {
    if (!dragActive) return;
    const t = e.touches[0]; const p = clientToCanvas(t.clientX, t.clientY);
    dragCurX = p.x; dragCurY = p.y;
    const dx = dragCurX - dragOriginX, dy = dragCurY - dragOriginY;
    touchAxisX = Math.max(-1, Math.min(1, dx / DRAG_MAX));
    touchAxisY = Math.max(-1, Math.min(1, dy / DRAG_MAX));
  }, { passive: true });
  ['touchend','touchcancel'].forEach(evt => wrapEl.addEventListener(evt, () => { dragActive = false; touchAxisX = 0; touchAxisY = 0; }, { passive: true }));

  // ---- resilience: auto-pause when backgrounded, and actually silence audio ----
  function suspendAudio() { if (audioCtx && audioCtx.state === 'running') audioCtx.suspend(); }
  function resumeAudioIfAllowed() { if (audioCtx && audioCtx.state === 'suspended' && soundOn && !document.hidden) audioCtx.resume(); }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (state === 'playing') togglePause(); suspendAudio(); }
    else resumeAudioIfAllowed();
  });
  window.addEventListener('pagehide', suspendAudio);
  window.addEventListener('blur', suspendAudio);
  window.addEventListener('focus', resumeAudioIfAllowed);

  // ---- orientation guard: this is a portrait game ----
  const rotateOverlay = document.getElementById('rotateOverlay');
  function checkOrientation() {
    const landscape = window.innerWidth > window.innerHeight;
    if (isTouch && landscape) { rotateOverlay.classList.add('show'); if (state === 'playing') togglePause(); }
    else rotateOverlay.classList.remove('show');
  }
  window.addEventListener('resize', checkOrientation);
  window.addEventListener('orientationchange', checkOrientation);
  checkOrientation();

  // ================= toast queue =================
  let toastQueue = [], toastTimer = 0;
  function queueToast(text) { toastQueue.push(text); }
  function updateToast() {
    if (toastTimer > 0) { toastTimer--; if (toastTimer === 0) toastBox.classList.remove('show'); }
    if (toastTimer <= 0 && toastQueue.length) {
      toastBox.textContent = toastQueue.shift();
      toastBox.classList.add('show');
      toastTimer = 170;
    }
  }

  // ================= world shape =================
  let waterDoodles = [], seagulls = [], hazards = [], particles = [], wakeTrail = [], pickups = [];
  function channelWidth(worldY) { const t = worldY*0.003; return 150 + Math.sin(t)*55*0.5 + Math.sin(t*2.1)*14; }
  function channelCenter(worldY) { const t = worldY*0.0022; return W/2 + Math.sin(t*1.3)*(W*0.2); }
  function difficultyAt(d) { return (1 + d/2600) * DIFFICULTIES[selDiff].spawnMult * LEVELS[currentLevelIdx].hazardMult; }

  function updateHealthUI() {
    healthBar.innerHTML = '';
    for (let i=0;i<maxHealth;i++){
      const s = document.createElement('span');
      s.className = 'heart' + (i < health ? '' : ' lost');
      s.textContent = '❤️';
      healthBar.appendChild(s);
    }
  }

  function resetGame() {
    const lvl = LEVELS[currentLevelIdx];
    biome = biomeForLevel(currentLevelIdx);
    TOTAL_DISTANCE = lvl.targetDistance;
    frame = 0; distance = 0; score = 0;
    maxHealth = DIFFICULTIES[selDiff].health;
    health = maxHealth;
    invuln = 0; hitsTaken = 0;
    speedBoostEndFrame = 0; shieldEndFrame = 0; fogEndFrame = 0;
    shakeMag = 0; shakeFrames = 0;
    nextEventAtDistance = 700 + Math.random()*400;
    nextRadioAtFrame = 200 + Math.random()*200;
    ship.x = W/2; ship.y = H-100; ship.wobble = 0;
    waterDoodles = [];
    for (let i=0;i<26;i++) waterDoodles.push({ x: Math.random()*W, y: Math.random()*H, r: 6+Math.random()*10, speed: 0.6+Math.random()*1.1 });
    seagulls = [];
    for (let i=0;i<3;i++) seagulls.push({ x: Math.random()*W, y: Math.random()*H*0.4, dir: Math.random()<0.5?1:-1, phase: Math.random()*10 });
    hazards = []; particles = []; wakeTrail = []; pickups = [];
    toastQueue = []; toastTimer = 0; toastBox.classList.remove('show');
    progressFill.style.width = '0%';
    progressLabel.textContent = `LVL ${lvl.id} · ${lvl.name.toUpperCase()}`;
    scoreLabel.textContent = '0';
    cargoTag.textContent = CARGO[selCargo].icon + ' ' + CARGO[selCargo].name;
    updateHealthUI();
    updateCoinUI();
  }

  function spawnHazard() {
    const diff = difficultyAt(distance);
    const worldYAhead = distance + H + 40;
    const cw = channelWidth(worldYAhead);
    const cc = channelCenter(worldYAhead);
    const roll = Math.random();
    let anchorX;
    if (roll < 0.4) {
      anchorX = cc - cw*0.35 + Math.random()*cw*0.7;
      hazards.push({ type:'pufferfish', x: anchorX, y:-30,
        vy: (1.6+diff*0.5+Math.random())*DIFFICULTIES[selDiff].speedMult, vx: (Math.random()-0.5)*0.6, r:15, phase: Math.random()*10 });
    } else if (roll < 0.7) {
      const fromLeft = Math.random() < 0.5;
      anchorX = fromLeft ? cc - cw/2 - 6 : cc + cw/2 + 6;
      hazards.push({ type:'coconut', x: anchorX, y:-30,
        vy: (3.4+diff*0.6)*DIFFICULTIES[selDiff].speedMult, vx: fromLeft?(0.8+Math.random()*0.6):-(0.8+Math.random()*0.6), r:11, spin:0 });
    } else {
      const fromLeft = Math.random() < 0.5;
      anchorX = fromLeft ? cc - cw/2 - 10 : cc + cw/2 + 10;
      for (let i=0;i<4;i++) particles.push({ x:anchorX, y:-30, vx:(Math.random()-0.5)*0.6, vy:-0.3-Math.random()*0.4, life:22, smoke:true });
      hazards.push({ type:'cannonball', x: anchorX, y:-30,
        vy: (2.4+diff*0.55)*DIFFICULTIES[selDiff].speedMult, vx: fromLeft?(2.0+Math.random()*1.2):-(2.0+Math.random()*1.2), r:9 });
    }
    if (Math.random() < 0.38) {
      const offset = (Math.random()<0.5?-1:1) * (20 + Math.random()*14);
      pickups.push({ x: anchorX+offset, y:-30, vy: 2.5+Math.random()*0.7, value: Math.random()<0.25?25:15, r:13, bob: Math.random()*10 });
    }
  }

  const EVENTS = [
    { text: '💨 Tailwind! Extra speed for a bit.', apply: () => { speedBoostEndFrame = frame + 260; } },
    { text: '🐬 A pod of dolphins escorts you — briefly unsinkable!', apply: () => { shieldEndFrame = frame + 190; } },
    { text: '🌫️ Fog bank ahead. Visibility drops.', apply: () => { fogEndFrame = frame + 280; } },
    { text: '🌊 Calm waters. Absolutely nothing happens.', apply: () => {} },
    { text: '🦆 A duck escaped overboard. It seems fine about it.', apply: () => {} }
  ];
  function maybeTriggerEvent() {
    if (distance >= nextEventAtDistance && distance < TOTAL_DISTANCE - 100) {
      const ev = EVENTS[Math.floor(Math.random()*EVENTS.length)];
      ev.apply();
      queueToast(ev.text);
      nextEventAtDistance = distance + 800 + Math.random()*500;
    }
  }
  function maybeTriggerRadio() {
    if (frame >= nextRadioAtFrame) {
      queueToast(RADIO_LINES[Math.floor(Math.random()*RADIO_LINES.length)]);
      nextRadioAtFrame = frame + 480 + Math.random()*360;
    }
  }

  function burst(x,y,color) {
    for (let i=0;i<10;i++) particles.push({ x, y, vx:(Math.random()-0.5)*4, vy:(Math.random()-0.5)*4, life: 24+Math.random()*14, color: color||'#ffd447' });
  }
  function splash(x,y) {
    for (let i=0;i<6;i++) particles.push({ x, y, vx:(Math.random()-0.5)*2.4, vy:-Math.random()*1.5, life: 18+Math.random()*10, color:'#dff6ff', small:true });
  }
  function triggerShake(mag, frames) { shakeMag = mag; shakeFrames = frames; }

  function hitShip(hx,hy) {
    if (frame < shieldEndFrame) return;
    health--; invuln = 90; hitsTaken++;
    burst(hx,hy,'#ff9f43');
    triggerShake(8, 12);
    playHitSfx();
    updateHealthUI();
    if (health <= 0) gameOver();
  }
  function collectPickup(p) {
    coins += p.value;
    score += p.value * 2;
    persistAll();
    updateCoinUI();
    burst(p.x, p.y, '#ffe08a');
    playCollectSfx();
  }

  function update() {
    frame++;
    const diff = difficultyAt(distance);

    let dx=0, dy=0;
    if (dragActive) {
      dx = touchAxisX; dy = touchAxisY;
    } else {
      if (keys['arrowleft']||keys['a']) dx -= 1;
      if (keys['arrowright']||keys['d']) dx += 1;
      if (keys['arrowup']||keys['w']) dy -= 1;
      if (keys['arrowdown']||keys['s']) dy += 1;
      if (dx!==0 && dy!==0) { dx*=0.7071; dy*=0.7071; }
    }

    const speedMult = (frame < speedBoostEndFrame ? 1.6 : 1) * DIFFICULTIES[selDiff].speedMult;
    ship.x += dx * ship.speed * speedMult;
    const forwardAmt = -dy * ship.speed * speedMult;
    distance += forwardAmt > 0 ? forwardAmt : forwardAmt*0.5;
    distance = Math.max(0, Math.min(TOTAL_DISTANCE, distance));
    ship.wobble = Math.sin(frame*0.15)*3 + dx*4;
    score = Math.floor(distance/3) + Math.floor(frame/12) + score;

    const worldY = distance;
    const cw = channelWidth(worldY), cc = channelCenter(worldY);
    const half = cw/2 - ship.w/2;
    if (ship.x < cc-half) ship.x = cc-half;
    if (ship.x > cc+half) ship.x = cc+half;
    ship.y = Math.max(60, Math.min(H-60, ship.y));

    progressFill.style.width = Math.round((distance/TOTAL_DISTANCE)*100)+'%';
    scoreLabel.textContent = score;

    if (frame % 4 === 0) wakeTrail.push({ x: ship.x, y: ship.y+20, life: 26 });
    for (let i=wakeTrail.length-1;i>=0;i--){ wakeTrail[i].life--; if (wakeTrail[i].life<=0) wakeTrail.splice(i,1); }

    for (const w of waterDoodles) { w.y += w.speed; if (w.y>H){ w.y=-10; w.x=Math.random()*W; } }
    for (const g of seagulls) { g.x += g.dir*0.6; g.phase += 0.1; if (g.x<-20||g.x>W+20) g.dir*=-1; }

    maybeTriggerEvent();
    maybeTriggerRadio();
    updateToast();

    const spawnEvery = Math.max(20, 60 - diff*11);
    if (frame % Math.floor(spawnEvery) === 0 && distance < TOTAL_DISTANCE - 80) spawnHazard();

    for (let i=hazards.length-1;i>=0;i--){
      const hz = hazards[i];
      hz.y += hz.vy; hz.x += hz.vx||0;
      if (hz.type==='pufferfish') hz.phase += 0.12;
      if (hz.type==='coconut') hz.spin += 0.3;
      if (hz.y > H+40 || hz.x < -60 || hz.x > W+60) {
        if (hz.type==='coconut' || hz.type==='cannonball') splash(hz.x, Math.min(hz.y,H-10));
        hazards.splice(i,1);
        continue;
      }
      if (invuln<=0) {
        const ddx=hz.x-ship.x, ddy=hz.y-ship.y;
        if (Math.sqrt(ddx*ddx+ddy*ddy) < hz.r+16) {
          hazards.splice(i,1);
          hitShip(hz.x,hz.y);
        }
      }
    }

    for (let i=pickups.length-1;i>=0;i--){
      const p = pickups[i];
      p.y += p.vy; p.bob += 0.2;
      if (p.y > H+40) { pickups.splice(i,1); continue; }
      const ddx=p.x-ship.x, ddy=p.y-ship.y;
      if (Math.sqrt(ddx*ddx+ddy*ddy) < p.r+16) {
        pickups.splice(i,1);
        collectPickup(p);
      }
    }

    if (invuln>0) invuln--;
    for (let i=particles.length-1;i>=0;i--){ const p=particles[i]; p.x+=p.vx; p.y+=p.vy; p.life--; if (p.life<=0) particles.splice(i,1); }
    if (shakeFrames>0) shakeFrames--;

    if (distance >= TOTAL_DISTANCE) winGame();
  }

  function runStats(won) {
    return {
      won, hitsTaken, finalHealth: health, timeSeconds: frame/60,
      difficultyName: DIFFICULTIES[selDiff].name,
      completedCount: completedLevelIds.size,
      allShipsOwned: unlockedSkinIdxs.size === SKINS.length
    };
  }
  function checkNewAchievements(won) {
    const stats = runStats(won);
    const fresh = [];
    for (const a of ACHIEVEMENTS) {
      if (!unlockedAchievements.has(a.id) && a.check(stats)) { unlockedAchievements.add(a.id); fresh.push(a); }
    }
    if (fresh.length) playAchievementSfx();
    return fresh;
  }
  function achievementsHtml(fresh) {
    if (!fresh.length) return '';
    return `<div class="big" style="font-size:14px;">🏆 New Achievement${fresh.length>1?'s':''}</div>` +
      fresh.map(a => `<p><b style="color:#ffd447">${a.name}</b> — ${a.desc}</p>`).join('');
  }

  function winGame() {
    state = 'win';
    pauseBtn.style.display = 'none';
    playWinSfx();
    const lvl = LEVELS[currentLevelIdx];
    completedLevelIds.add(lvl.id);
    if (lvl.id === highestUnlockedLevel && highestUnlockedLevel < LEVELS.length) highestUnlockedLevel++;
    coins += lvl.coinReward;
    persistAll();
    const fresh = checkNewAchievements(true);
    const isFinal = lvl.id === LEVELS.length;
    overlay.classList.remove('overlay-pause');
    overlay.style.display = 'flex';
    overlay.innerHTML = `
      <div id="shipPreview">${isFinal ? '🏆' : '🎉'}</div>
      <h1>${isFinal ? 'STRAIT ESCAPE COMPLETE!' : 'LEVEL CLEARED!'}</h1>
      <div class="tagline">Level ${lvl.id} — ${lvl.name} (${lvl.full})</div>
      <div class="big">Score: ${score}</div>
      <div class="coinPill">🪙 +${lvl.coinReward} this run — ${coins} total</div>
      ${achievementsHtml(fresh)}
      ${isFinal
        ? `<p>All 50 waterways charted. ${SKINS[selSkin].name} is legend now.</p>`
        : `<button class="startBtn" id="nextBtn">NEXT LEVEL ▶ ${LEVELS[currentLevelIdx+1].place}</button>`}
      <button class="smallLink" id="levelSelectBtn">🗺️ Level Select</button>
      <button class="smallLink" id="menuBtn2">Main Menu</button>
    `;
    if (!isFinal) {
      document.getElementById('nextBtn').addEventListener('click', () => {
        playClickSfx();
        currentLevelIdx = Math.min(currentLevelIdx+1, LEVELS.length-1);
        startGame();
      });
    }
    document.getElementById('levelSelectBtn').addEventListener('click', () => { playClickSfx(); showLevelSelect(); });
    document.getElementById('menuBtn2').addEventListener('click', () => { playClickSfx(); showMainMenu(); });
  }

  function gameOver() {
    state = 'over';
    pauseBtn.style.display = 'none';
    triggerShake(14, 20);
    playGameOverSfx();
    const lvl = LEVELS[currentLevelIdx];
    const fresh = checkNewAchievements(false);
    overlay.classList.remove('overlay-pause');
    overlay.style.display = 'flex';
    overlay.innerHTML = `
      <div id="shipPreview">🫠</div>
      <h1>HULL BREACHED</h1>
      <div class="tagline">Level ${lvl.id} — ${lvl.name} got the better of the ${SKINS[selSkin].name}</div>
      <div class="big">Score: ${score}</div>
      <div class="coinPill">🪙 ${coins} total (coins collected this run are kept)</div>
      ${achievementsHtml(fresh)}
      <button class="startBtn" id="retryBtn">RETRY LEVEL</button>
      <button class="smallLink" id="levelSelectBtn">🗺️ Level Select</button>
      <button class="smallLink" id="menuBtn2">Main Menu</button>
    `;
    document.getElementById('retryBtn').addEventListener('click', () => { playClickSfx(); startGame(); });
    document.getElementById('levelSelectBtn').addEventListener('click', () => { playClickSfx(); showLevelSelect(); });
    document.getElementById('menuBtn2').addEventListener('click', () => { playClickSfx(); showMainMenu(); });
  }

  function togglePause() {
    if (state === 'playing') {
      state = 'paused';
      pauseBtn.textContent = '▶';
      playClickSfx();
      overlay.classList.add('overlay-pause');
      overlay.style.display = 'flex';
      overlay.innerHTML = `
        <h1 style="font-size:26px;">PAUSED</h1>
        <div class="tagline">Take a breath, Captain.</div>
        <button class="startBtn" id="resumeBtn">RESUME</button>
        <button class="startBtn" id="restartBtn" style="margin-top:8px;background:#4fb3d9;border-color:#7fe0ff;">RESTART LEVEL</button>
        <button class="smallLink" id="menuBtn">Main Menu</button>
      `;
      document.getElementById('resumeBtn').addEventListener('click', togglePause);
      document.getElementById('restartBtn').addEventListener('click', () => {
        playClickSfx(); overlay.classList.remove('overlay-pause'); pauseBtn.textContent = '⏸'; startGame();
      });
      document.getElementById('menuBtn').addEventListener('click', () => {
        playClickSfx(); overlay.classList.remove('overlay-pause'); showMainMenu();
      });
    } else if (state === 'paused') {
      state = 'playing';
      pauseBtn.textContent = '⏸';
      overlay.style.display = 'none';
      overlay.classList.remove('overlay-pause');
      playClickSfx();
    }
  }

  // ================= drawing =================
  function drawChannel() {
    const steps=24;
    ctx.fillStyle=biome.coast; ctx.strokeStyle=biome.coastDark; ctx.lineWidth=4;
    ctx.beginPath();
    for (let i=0;i<=steps;i++){ const sy=(H/steps)*i; const wy=distance+(H-sy); const cw=channelWidth(wy); const cc=channelCenter(wy); const lx=cc-cw/2; if(i===0) ctx.moveTo(0,sy); else ctx.lineTo(lx,sy); }
    for (let i=steps;i>=0;i--) ctx.lineTo(0,(H/steps)*i);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath();
    for (let i=0;i<=steps;i++){ const sy=(H/steps)*i; const wy=distance+(H-sy); const cw=channelWidth(wy); const cc=channelCenter(wy); const rx=cc+cw/2; if(i===0) ctx.moveTo(W,sy); else ctx.lineTo(rx,sy); }
    for (let i=steps;i>=0;i--) ctx.lineTo(W,(H/steps)*i);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.font='20px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    for (let i=0;i<steps;i+=3){
      const sy=(H/steps)*i; const wy=distance+(H-sy); const cw=channelWidth(wy); const cc=channelCenter(wy);
      const sway = Math.sin(frame*0.03 + i)*0.15;
      ctx.save(); ctx.translate(cc-cw/2-22, sy); ctx.rotate(sway); ctx.fillText(biome.decor,0,0); ctx.restore();
      ctx.save(); ctx.translate(cc+cw/2+22, sy); ctx.rotate(-sway); ctx.fillText(biome.decor,0,0); ctx.restore();
    }
    ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  }
  function drawWater() { ctx.fillStyle='rgba(255,255,255,0.18)'; for (const w of waterDoodles){ ctx.beginPath(); ctx.ellipse(w.x,w.y,w.r,w.r*0.4,0,0,Math.PI*2); ctx.fill(); } }
  function drawWake() {
    for (const wtrail of wakeTrail) {
      ctx.globalAlpha = Math.max(0, wtrail.life/26) * 0.35;
      ctx.fillStyle = '#eafcff';
      ctx.beginPath(); ctx.ellipse(wtrail.x, wtrail.y, 7, 4, 0, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  function drawFinishLine() {
    const worldYAtBottom = distance+H;
    if (worldYAtBottom > TOTAL_DISTANCE-40 && distance < TOTAL_DISTANCE) {
      const sy = H-(TOTAL_DISTANCE-distance);
      if (sy>-60 && sy<H+60) {
        const cw=channelWidth(TOTAL_DISTANCE), cc=channelCenter(TOTAL_DISTANCE);
        ctx.save(); ctx.strokeStyle='#ffd447'; ctx.lineWidth=6; ctx.setLineDash([14,10]);
        ctx.beginPath(); ctx.moveTo(cc-cw/2,sy); ctx.lineTo(cc+cw/2,sy); ctx.stroke(); ctx.setLineDash([]);
        ctx.font='bold 14px sans-serif'; ctx.fillStyle='#ffd447'; ctx.textAlign='center';
        ctx.fillText('⚓ ' + LEVELS[currentLevelIdx].place.toUpperCase(), cc, sy-14); ctx.textAlign='left'; ctx.restore();
      }
    }
  }
  function drawSeagulls() { ctx.font='18px serif'; for (const g of seagulls){ const bob=Math.sin(g.phase)*4; ctx.save(); ctx.translate(g.x,g.y+bob); if(g.dir<0) ctx.scale(-1,1); ctx.fillText('🕊️',-9,0); ctx.restore(); } }
  function drawHazards() {
    ctx.font='24px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    for (const hz of hazards) {
      ctx.save(); ctx.translate(hz.x,hz.y);
      if (hz.type==='pufferfish'){ const p=Math.sin(hz.phase)*0.15+1; ctx.scale(p,p); ctx.fillText('🐡',0,0); }
      else if (hz.type==='coconut'){ ctx.rotate(hz.spin); ctx.fillText('🥥',0,0); }
      else ctx.fillText('💣',0,0);
      ctx.restore();
    }
    ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  }
  function drawPickups() {
    ctx.font='22px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    for (const p of pickups) {
      const bobY = Math.sin(p.bob)*3;
      ctx.save();
      ctx.globalAlpha = 0.35;
      ctx.fillStyle = '#ffe08a';
      ctx.beginPath(); ctx.arc(p.x, p.y+bobY, 16, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillText('🦆', p.x, p.y+bobY);
      ctx.restore();
    }
    ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  }
  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life/ (p.smoke?22:30));
      ctx.fillStyle = p.smoke ? '#cccccc' : (p.color || '#ffd447');
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.small ? 2 : (p.smoke ? 5 : 3), 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  function drawShip() {
    if (invuln>0 && frame%8>=4) return;
    const skin = SKINS[selSkin];
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.beginPath(); ctx.ellipse(ship.x+3, ship.y+26, 16, 6, 0, 0, Math.PI*2); ctx.fill();
    ctx.restore();

    ctx.save(); ctx.translate(ship.x,ship.y); ctx.rotate(ship.wobble*Math.PI/180*0.3);
    if (frame < shieldEndFrame) { ctx.save(); ctx.globalAlpha=0.25; ctx.fillStyle='#7fe0ff'; ctx.beginPath(); ctx.arc(0,0,30,0,Math.PI*2); ctx.fill(); ctx.restore(); }

    const grad = ctx.createLinearGradient(-17,0,17,0);
    grad.addColorStop(0, skin.hullDark);
    grad.addColorStop(0.5, skin.hull);
    grad.addColorStop(1, skin.hullDark);
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.moveTo(-17,-20); ctx.lineTo(17,-20); ctx.lineTo(14,22); ctx.quadraticCurveTo(0,30,-14,22); ctx.closePath(); ctx.fill();
    ctx.strokeStyle=skin.trim; ctx.lineWidth=2; ctx.stroke();
    const colors = CARGO[selCargo].colors;
    for (let i=0;i<3;i++){ ctx.fillStyle=colors[i]; ctx.fillRect(-13,-14+i*11,26,9); ctx.strokeStyle='rgba(0,0,0,0.2)'; ctx.strokeRect(-13,-14+i*11,26,9); }
    ctx.fillStyle='#f5f5f5'; ctx.fillRect(-8,18,16,8); ctx.strokeStyle='#999'; ctx.strokeRect(-8,18,16,8);
    ctx.restore();
  }
  function drawFog() {
    if (frame < fogEndFrame) {
      const g = ctx.createRadialGradient(ship.x, ship.y-40, 60, ship.x, ship.y-40, 340);
      g.addColorStop(0, 'rgba(220,235,240,0)');
      g.addColorStop(1, 'rgba(220,235,240,0.75)');
      ctx.fillStyle = g;
      ctx.fillRect(0,0,W,H);
    }
  }
  function drawVignette() {
    const g = ctx.createRadialGradient(W/2, H/2, H*0.35, W/2, H/2, H*0.72);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,10,16,0.35)');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);
  }
  function drawJoystick() {
    if (!dragActive) return;
    ctx.save();
    ctx.globalAlpha = 0.22; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(dragOriginX, dragOriginY, DRAG_MAX, 0, Math.PI*2); ctx.stroke();
    ctx.globalAlpha = 0.45; ctx.fillStyle = '#ffd447';
    ctx.beginPath(); ctx.arc(dragOriginX + touchAxisX*DRAG_MAX, dragOriginY + touchAxisY*DRAG_MAX, 20, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
  function draw() {
    ctx.save();
    if (shakeFrames > 0) ctx.translate((Math.random()-0.5)*shakeMag, (Math.random()-0.5)*shakeMag);
    ctx.clearRect(-20,-20,W+40,H+40);
    ctx.fillStyle=biome.water; ctx.fillRect(-20,-20,W+40,H+40);
    drawWater(); drawChannel(); drawWake(); drawFinishLine(); drawSeagulls(); drawPickups(); drawHazards(); drawParticles(); drawShip();
    drawFog();
    drawVignette();
    drawJoystick();
    ctx.restore();
  }

  function loop() { if (state==='playing'){ update(); draw(); } requestAnimationFrame(loop); }

  function startGame() {
    resetGame();
    overlay.style.display='none';
    overlay.classList.remove('overlay-pause');
    pauseBtn.style.display = 'flex';
    pauseBtn.textContent = '⏸';
    touchHint.style.display = 'none';
    state='playing';
  }

  // ================= menus =================
  function showMainMenu() {
    state = 'menu';
    pauseBtn.style.display = 'none';
    touchHint.style.display = isTouch ? 'block' : 'none';
    overlay.classList.remove('overlay-pause');
    overlay.style.display = 'flex';
    const nextLvl = LEVELS[nextIncompleteLevelIdx()];
    const owned = unlockedSkinIdxs.has(selSkin);
    let startAreaHtml;
    if (owned) {
      startAreaHtml = `<button class="startBtn" id="startBtn">▶ LEVEL ${nextLvl.id}: ${nextLvl.name}</button>`;
    } else {
      const price = SKINS[selSkin].price;
      const afford = coins >= price;
      startAreaHtml = `<button class="startBtn" id="buyBtn" ${afford?'':'style="opacity:0.55;"'}>🔒 UNLOCK ${SKINS[selSkin].name} — 🪙 ${price}</button>` +
        (afford ? '' : `<p style="opacity:0.75;">Need 🪙 ${price-coins} more — grab ducks floating near hazards to earn coins.</p>`);
    }
    overlay.innerHTML = `
      <div id="shipPreview">🚢</div>
      <h1>STRAIT ESCAPE</h1>
      <div class="tagline">Level ${nextLvl.id} of ${LEVELS.length} — next up: ${nextLvl.name}</div>
      <div class="coinPill">🪙 ${coins}</div>

      <div class="picker">
        <button class="pickerArrow" id="skinPrev">◀</button>
        <div class="pickerLabel"><span class="swatch" style="background:${SKINS[selSkin].hull}"></span>${SKINS[selSkin].name}${owned ? '' : ` <span class="lock">🔒 ${SKINS[selSkin].price}🪙</span>`}</div>
        <button class="pickerArrow" id="skinNext">▶</button>
      </div>
      <div class="picker">
        <button class="pickerArrow" id="cargoPrev">◀</button>
        <div class="pickerLabel">${CARGO[selCargo].icon} ${CARGO[selCargo].name}</div>
        <button class="pickerArrow" id="cargoNext">▶</button>
      </div>
      <div class="diffRow" id="diffRow">
        ${DIFFICULTIES.map((d,i)=>`<button class="diffBtn ${i===selDiff?'active':''}" data-i="${i}">${d.name}</button>`).join('')}
      </div>

      <p style="opacity:0.7;">${isTouch ? 'Drag anywhere on the water to steer' : 'Arrows / WASD to steer'} • P to pause</p>

      ${startAreaHtml}
      <button class="smallLink" id="levelsLink">🗺️ Level Select (${completedLevelIds.size}/${LEVELS.length} cleared)</button>
      <button class="smallLink" id="achLink">🏆 Achievements (${unlockedAchievements.size}/${ACHIEVEMENTS.length})</button>
    `;
    document.getElementById('skinPrev').addEventListener('click', ()=>{ playClickSfx(); selSkin=(selSkin-1+SKINS.length)%SKINS.length; showMainMenu(); });
    document.getElementById('skinNext').addEventListener('click', ()=>{ playClickSfx(); selSkin=(selSkin+1)%SKINS.length; showMainMenu(); });
    document.getElementById('cargoPrev').addEventListener('click', ()=>{ playClickSfx(); selCargo=(selCargo-1+CARGO.length)%CARGO.length; showMainMenu(); });
    document.getElementById('cargoNext').addEventListener('click', ()=>{ playClickSfx(); selCargo=(selCargo+1)%CARGO.length; showMainMenu(); });
    document.querySelectorAll('.diffBtn').forEach(btn => {
      btn.addEventListener('click', () => { playClickSfx(); selDiff = parseInt(btn.dataset.i); showMainMenu(); });
    });
    if (owned) {
      document.getElementById('startBtn').addEventListener('click', () => { playClickSfx(); currentLevelIdx = nextIncompleteLevelIdx(); startGame(); });
    } else {
      const buyBtn = document.getElementById('buyBtn');
      buyBtn.addEventListener('click', () => {
        const price = SKINS[selSkin].price;
        if (coins >= price) {
          coins -= price; unlockedSkinIdxs.add(selSkin); persistAll(); updateCoinUI(); playAchievementSfx();
        } else { playHitSfx(); }
        showMainMenu();
      });
    }
    document.getElementById('levelsLink').addEventListener('click', () => { playClickSfx(); showLevelSelect(); });
    document.getElementById('achLink').addEventListener('click', () => { playClickSfx(); showAchievements(); });
  }

  function showLevelSelect() {
    touchHint.style.display = 'none';
    overlay.innerHTML = `
      <h1 style="font-size:22px;">LEVEL SELECT</h1>
      <div class="tagline">${completedLevelIds.size} of ${LEVELS.length} waterways cleared</div>
      <div id="levelList">
        ${LEVELS.map(lvl => {
          const unlocked = lvl.id <= highestUnlockedLevel;
          const done = completedLevelIds.has(lvl.id);
          const stat = done ? '⭐' : (unlocked ? '▶' : '🔒');
          const bc = biomeForLevel(lvl.id-1).coast;
          return `<div class="levelRow ${unlocked?'unlocked':'locked'}" data-idx="${lvl.id-1}">
            <div class="num">${lvl.id}</div>
            <span class="swatch" style="background:${bc}"></span>
            <div class="lname">${lvl.name} <span style="opacity:0.6;">(${lvl.full})</span></div>
            <div class="stat">${stat}</div>
          </div>`;
        }).join('')}
      </div>
      <button class="startBtn" id="backBtn">BACK</button>
    `;
    document.querySelectorAll('.levelRow.unlocked').forEach(row => {
      row.addEventListener('click', () => {
        playClickSfx();
        currentLevelIdx = parseInt(row.dataset.idx);
        startGame();
      });
    });
    document.getElementById('backBtn').addEventListener('click', () => { playClickSfx(); showMainMenu(); });
  }

  function showAchievements() {
    overlay.innerHTML = `
      <h1 style="font-size:24px;">ACHIEVEMENTS</h1>
      <div class="tagline">${unlockedAchievements.size} of ${ACHIEVEMENTS.length} unlocked this session</div>
      <div id="achList">
        ${ACHIEVEMENTS.map(a => {
          const got = unlockedAchievements.has(a.id);
          return `<div class="achItem ${got?'':'locked'}"><div class="ic">${got?'🏆':'🔒'}</div><div class="txt"><b>${a.name}</b>${a.desc}</div></div>`;
        }).join('')}
      </div>
      <button class="startBtn" id="backBtn">BACK</button>
    `;
    document.getElementById('backBtn').addEventListener('click', () => { playClickSfx(); showMainMenu(); });
  }

  showMainMenu();
  draw();
  requestAnimationFrame(loop);
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(()=>{});
    });
  }
})();
</script>
</body>
</html>
